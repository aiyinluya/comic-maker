name: smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Parse example storyboard (single source of truth)
        run: python scripts/parse_storyboard.py --storyboard examples/example-storyboard.md --out examples/bubbles.parsed.json
      - name: Draw bubbles from parsed storyboard
        run: python scripts/draw_bubbles.py --bubbles examples/bubbles.parsed.json --dir examples/assets
      - name: Lint drawn panels
        run: python scripts/lint.py --dir examples/assets --bubbles examples/bubbles.parsed.json
      - name: Verify outputs
        run: |
          test -f examples/assets/panel-01.final.jpg
          test -f examples/assets/panel-02.final.jpg
          echo "smoke OK"
      - name: Guard against hardcoded absolute paths
        run: |
          # R16 防回归：核心脚本不许硬编码用户目录。
          # 白名单：环境变量行（os.environ.get 同行）与 _DEFAULT 常量定义行。
          if grep -rn -E "C:\\\\Users|/home/[a-z]|/Users/" scripts/ --include="*.py" \
             | grep -v "os.environ.get" | grep -v "_DEFAULT"; then
            echo "::error::hardcoded absolute path found in scripts/"
            exit 1
          fi
          echo "path guard OK"
      - name: Parse all stories (repro pack integrity)
        run: |
          for sb in stories/*/storyboard.md; do
            python scripts/parse_storyboard.py --storyboard "$sb" --out /tmp/$(basename $(dirname "$sb")).json
          done
          echo "stories parse OK: $(ls /tmp/*.json | wc -l) files"
